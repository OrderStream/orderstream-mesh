name: "OrderStream Enterprise Engineering Mesh"
description: "Unified 102-Solver DevSecOps & VCS Performance Engine across 10 Pillars for Enterprise Monorepos & Protocol Engineering"
author: "OrderStream <healthdecoded77@gmail.com>"
branding:
  icon: "cpu"
  color: "blue"

inputs:
  command:
    description: "Mesh command to execute (e.g. list-pillars, scan-workflow, verify-case, solve-merge, fuzz-diff)"
    required: false
    default: "list-pillars"
  workflow_file:
    description: "Target workflow YAML file for context taint security scan"
    required: false
    default: ""
  paths:
    description: "Space-delimited paths to check for Unicode NFKC case collision"
    required: false
    default: ""
  license_key:
    description: "OrderStream Enterprise cryptographically signed license key"
    required: false
    default: ""

outputs:
  status:
    description: "Execution status of the mesh evaluation"
    value: ${{ steps.mesh_runner.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install OrderStream Mesh
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e "${{ github.action_path }}"

    - name: Execute OrderStream Mesh Runner
      id: mesh_runner
      shell: bash
      env:
        MESH_COMMAND: ${{ inputs.command }}
        MESH_WORKFLOW_FILE: ${{ inputs.workflow_file }}
        MESH_PATHS: ${{ inputs.paths }}
      run: |
        echo "Running OrderStream Enterprise Engineering Mesh..."
        if [ "$MESH_COMMAND" = "list-pillars" ]; then
          orderstream-mesh list-pillars
        elif [ "$MESH_COMMAND" = "scan-workflow" ]; then
          orderstream-mesh scan-workflow --file "$MESH_WORKFLOW_FILE"
        elif [ "$MESH_COMMAND" = "verify-case" ]; then
          orderstream-mesh verify-case "$MESH_PATHS"
        elif [ "$MESH_COMMAND" = "all" ] || [ -z "$MESH_COMMAND" ]; then
          orderstream-mesh list-pillars
        else
          echo "Unknown or unapproved command: $MESH_COMMAND"
          exit 1
        fi
        echo "status=SUCCESS" >> "$GITHUB_OUTPUT"


