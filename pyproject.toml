[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orderstream-mesh"
version = "2.0.0"
description = "OrderStream Enterprise Engineering Mesh - 100+ High-Performance Solvers across 10 Pillars for Monorepo, DevSecOps, and Protocol Infrastructure"
authors = [{ name = "OrderStream", email = "healthdecoded77@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
orderstream-mesh = "orderstream_mesh.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

